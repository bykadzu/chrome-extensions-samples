<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Instagram-inspired gradient background -->
  <defs>
    <linearGradient id="instagramGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#405de6;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#5851db;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#833ab4;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#c13584;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd1d1d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="26" ry="26" fill="url(#instagramGradient)"/>

  <!-- Message bubble icon -->
  <path d="M 64 32 C 46 32 32 44 32 58 C 32 66 36 73 42 78 L 40 88 L 52 82 C 56 84 60 85 64 85 C 82 85 96 73 96 58 C 96 44 82 32 64 32 Z"
        fill="white" stroke="white" stroke-width="2"/>

  <!-- Eye icon (tracking/watching) -->
  <ellipse cx="64" cy="58" rx="18" ry="12" fill="url(#instagramGradient)"/>
  <circle cx="64" cy="58" r="6" fill="white"/>

  <!-- Small notification dot -->
  <circle cx="92" cy="36" r="8" fill="#ff4444" stroke="white" stroke-width="2"/>
</svg>
